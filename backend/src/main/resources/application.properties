spring.application.name=muse-backend
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:muse}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${MYSQL_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:muse}
spring.datasource.password=${MYSQL_PASSWORD:demo-only-change-me}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.resolve-lazily=true
spring.jackson.serialization.write-dates-as-timestamps=false
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.storage-path=${STORAGE_PATH:./storage}
app.cookie-secure=${COOKIE_SECURE:false}
app.simulation-enabled=${SIMULATION_ENABLED:true}
app.default-step-delay-ms=${STEP_DELAY_MS:2500}
app.task-queue-capacity=${TASK_QUEUE_CAPACITY:128}
